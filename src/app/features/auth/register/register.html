<div class="register-container container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4 p-md-5 w-100" style="max-width: 450px;">
    <h2 class="card-title text-center mb-4 fs-3 fw-bold">Register New Account</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group mb-3 text-start">
        <label for="username" class="form-label">Username:</label>
        <input type="text" id="username" formControlName="username" class="form-control" placeholder="Enter username">
        <div *ngIf="registerForm.get('username')?.invalid && (registerForm.get('username')?.dirty || registerForm.get('username')?.touched)" class="error-message text-danger mt-1 small">
          <div *ngIf="registerForm.get('username')?.errors?.['required']">Username is required.</div>
        </div>
      </div>
      <div class="form-group mb-3 text-start">
        <label for="email" class="form-label">Email:</label>
        <input type="email" id="email" formControlName="email" class="form-control" placeholder="Enter your email">
        <div *ngIf="registerForm.get('email')?.invalid && (registerForm.get('email')?.dirty || registerForm.get('email')?.touched)" class="error-message text-danger mt-1 small">
          <div *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</div>
          <div *ngIf="registerForm.get('email')?.errors?.['email']">Invalid email.</div>
        </div>
      </div>
      <div class="form-group mb-3 text-start">
        <label for="password" class="form-label">Password:</label>
        <input type="password" id="password" formControlName="password" class="form-control" placeholder="Enter password">
        <div *ngIf="registerForm.get('password')?.invalid && (registerForm.get('password')?.dirty || registerForm.get('password')?.touched)" class="error-message text-danger mt-1 small">
          <div *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</div>
          <div *ngIf="registerForm.get('password')?.errors?.['minlength']">Must be at least 6 characters.</div>
        </div>
      </div>
      <div class="form-group mb-4 text-start">
        <label for="confirmPassword" class="form-label">Confirm Password:</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control" placeholder="Re-enter password">
        <div *ngIf="registerForm.get('confirmPassword')?.invalid && (registerForm.get('confirmPassword')?.dirty || registerForm.get('confirmPassword')?.touched)" class="error-message text-danger mt-1 small">
          <div *ngIf="registerForm.get('confirmPassword')?.errors?.['required']">Confirm password is required.</div>
          <div *ngIf="registerForm.get('confirmPassword')?.errors?.['passwordMismatch']">Passwords do not match.</div>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message alert alert-danger text-center small" role="alert">{{ errorMessage }}</div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-semibold" [disabled]="registerForm.invalid">Register</button>
    </form>
    <p class="text-center mt-4 mb-0 text-muted small">Already have an account? <a routerLink="/login" class="text-decoration-none fw-semibold">Login</a></p>
  </div>
</div>
