<div class="glass-card login-card animate-fade-in">
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm" autocomplete="off">
    <h2 class="mb-4 text-center">Login</h2>
    <div class="mb-3 input-group">
      <span class="input-group-text"><mat-icon>person</mat-icon></span>
      <input id="identifier" name="identifier" [(ngModel)]="identifier" required class="form-control mat-input-element" placeholder="Username or Email" />
    </div>
    <div class="mb-3 input-group">
      <span class="input-group-text"><mat-icon>lock</mat-icon></span>
      <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" required class="form-control mat-input-element" placeholder="Password" />
      <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()" tabindex="-1">
        <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>
    <button type="submit" class="btn btn-primary w-100 mat-raised-button">Login</button>
    <div *ngIf="errorMessage" class="error text-danger mt-2 text-center">{{ errorMessage }}</div>
  </form>
  <div class="text-center mt-3">
    <a routerLink="/register" class="text-secondary">Don't have an account? Register</a>
  </div>
</div>
