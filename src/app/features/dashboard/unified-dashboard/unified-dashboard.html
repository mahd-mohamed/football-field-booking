<div class="unified-dashboard p-4 bg-light min-vh-100">
  <h2 class="fw-bold text-primary mb-5 text-center">Dashboard</h2>
  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm p-4 text-center">
        <h5 class="card-title mb-3">My Teams</h5>
        <p class="mb-4">Manage your teams and invitations.</p>
        <a routerLink="/dashboard/teams" class="btn btn-outline-success w-100">Manage Teams</a>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm p-4 text-center">
        <h5 class="card-title mb-3">My Matches</h5>
        <p class="mb-4">Schedule and manage your matches.</p>
        <a routerLink="/dashboard/matches" class="btn btn-outline-primary w-100">Manage Matches</a>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm p-4 text-center">
        <h5 class="card-title mb-3">My Bookings</h5>
        <p class="mb-4">View and manage your bookings.</p>
        <a routerLink="/dashboard/bookings" class="btn btn-outline-info w-100">My Bookings</a>
      </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
      <div class="card shadow-sm p-4 text-center">
        <h5 class="card-title mb-3">My Profile</h5>
        <p class="mb-4">View and edit your profile.</p>
        <a routerLink="/dashboard/profile" class="btn btn-outline-primary w-100">My Profile</a>
      </div>
    </div>
  </div>
</div>
